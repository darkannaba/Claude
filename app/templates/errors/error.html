<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}" class="h-full{{ ' ar' if lang == 'ar' else '' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status_code }} – {{ title }}</title>
  {% include "layout/_branding_head.html" %}
  <script src="/static/js/theme.js"></script>
</head>
<body class="flex h-full items-center justify-center p-6">
  <div class="card w-full max-w-md text-center">
    {% if branding and branding.logo %}
      {# Carte claire / foncée selon le mode : logo principal en clair, variante sombre en mode sombre. #}
      <img src="{{ branding.logo }}" alt="{{ _("Logo de l'établissement") }}" class="brand-logo mx-auto mb-4 h-12 w-auto max-w-[12rem] object-contain dark:hidden">
      <img src="{{ branding.logo_dark }}" alt="{{ _("Logo de l'établissement") }}" class="brand-logo mx-auto mb-4 hidden h-12 w-auto max-w-[12rem] object-contain dark:block">
    {% endif %}
    <div class="text-5xl font-bold text-link">{{ status_code }}</div>
    <h1 class="mt-2 text-xl font-semibold">{{ title }}</h1>
    <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">{{ message }}</p>
    <div class="mt-6 flex justify-center gap-2">
      <a class="btn-secondary" href="/login">{{ _("Connexion") }}</a>
      <a class="btn-primary" href="/">{{ _("Accueil") }}</a>
    </div>
  </div>
</body>
</html>
