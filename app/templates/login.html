{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-10 card">
  <h1 class="text-xl font-bold mb-1">{{ s.hotel_name }}</h1>
  <p class="muted text-sm mb-4">Connexion à l'espace de gestion</p>
  {% if error %}<div class="flash-err mb-3">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="space-y-3">
    <label class="block"><span class="lbl">Identifiant</span>
      <input class="inp" name="username" required autofocus autocomplete="username"></label>
    <label class="block"><span class="lbl">Mot de passe</span>
      <input class="inp" type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary w-full" type="submit">Se connecter</button>
  </form>
</div>
{% endblock %}
