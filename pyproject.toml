[project]
name = "hotel-pms-annaba"
version = "2.0.0"
description = "PMS / CRM hôtelier pour un hôtel de 30 chambres à Annaba (Algérie)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*httpx.*:Warning",
]

[tool.coverage.run]
source = ["app"]
branch = false
# SQLAlchemy asynchrone exécute le code via des greenlets : sans cette option, coverage perd la trace.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
